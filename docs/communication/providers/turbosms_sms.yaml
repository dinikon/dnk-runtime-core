provider_code: turbosms
provider_name: TurboSMS SMS
version: "1.0.0"
connector_type: YAML_HTTP

channels:
  - SMS

auth:
  type: bearer
  token_secret_key: api_key

config_schema:
  type: object
  required:
    - sender
  properties:
    sender:
      type: string
      title: Sender name
      description: Activated TurboSMS alpha name for SMS messages.
      default: TurboSMS
      maxLength: 25

secrets_schema:
  type: object
  required:
    - api_key
  properties:
    api_key:
      type: string
      title: TurboSMS API key
      format: password

message_types:
  - code: sms_text
    channel: SMS
    name: Plain text SMS
    field_schema:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          title: SMS text
          description: Up to 1521 Latin or 661 Cyrillic characters according to TurboSMS limits.
          maxLength: 1521
    ui_schema:
      text:
        ui:widget: textarea
    send:
      transport: http
      method: POST
      url: https://api.turbosms.ua/message/send.json
      headers:
        Content-Type: application/json
      body:
        sequence_id: "{{ message.outbound_message_id }}"
        recipients:
          - "{{ recipient.address }}"
        sms:
          sender: "{{ config.sender }}"
          text: "{{ template.text }}"
      response_mapping:
        external_message_id: "$.response_result[0].message_id"
        external_status: "$.response_result[0].response_status"

webhook:
  external_message_id_path: "$.data.message_id"
  external_status_path: "$.data.status"
  event_time_path: "$.data.dlr_date"

status_mapping:
  OK: SENT
  Queued: SENT
  Accepted: SENT
  Sent: SENT
  Delivered: DELIVERED
  Read: OPENED
  Expired: EXPIRED
  Undelivered: UNDELIVERED
  Rejected: FAILED
  Failed: FAILED
  Cancelled: CANCELED

retry_policy:
  max_attempts: 3
  backoff:
    type: exponential
    initial_seconds: 30
    max_seconds: 600

rate_limit:
  per_second: 50
  per_minute: 3000
