provider_code: esputnik_email
provider_name: eSputnik Email
version: "1.0.0"
connector_type: YAML_HTTP

channels:
  - EMAIL

auth:
  type: basic
  username_secret_key: username
  password_secret_key: password

config_schema:
  type: object
  required:
    - from_address
    - from_name
  properties:
    from_address:
      type: string
      title: Default from address
      format: email
    from_name:
      type: string
      title: Default from name

secrets_schema:
  type: object
  required:
    - username
    - password
  properties:
    username:
      type: string
      title: eSputnik username
    password:
      type: string
      title: eSputnik password
      format: password

message_types:
  - code: email_raw_html
    channel: EMAIL
    name: eSputnik raw HTML email
    field_schema:
      type: object
      required:
        - subject
        - html_text
      properties:
        subject:
          type: string
          title: Subject
          maxLength: 255
        html_text:
          type: string
          title: HTML body
        from_address:
          type: string
          title: Override from address
          format: email
        from_name:
          type: string
          title: Override from name
    ui_schema:
      html_text:
        ui:widget: textarea
    send:
      transport: http
      method: POST
      url: https://esputnik.com/api/v1/message/email
      headers:
        Accept: application/json; charset=UTF-8
        Content-Type: application/json
      body:
        emails:
          - "{{ recipient.address }}"
        externalRequestId: "{{ message.outbound_message_id }}"
        htmlText: "{{ template.html_text }}"
        subject: "{{ template.subject }}"
        from: '"{{ template.from_name | default(config.from_name) }}" <{{ template.from_address | default(config.from_address) }}>'
      response_mapping: { }

  - code: email_prepared_smartsend
    channel: EMAIL
    name: eSputnik prepared email smart send
    field_schema:
      type: object
      required:
        - prepared_message_id

      properties:
        prepared_message_id:
          type: integer
          title: eSputnik prepared message ID

    send:
      transport: http
      method: POST
      url: https://esputnik.com/api/v1/message/{{ template.prepared_message_id }}/smartsend
      headers:
        Accept: application/json; charset=UTF-8
        Content-Type: application/json
      body:
        recipients:
          - locator: "{{ recipient.address }}"
            jsonParam: "{{ variables | tojson | tojson }}"
        email: true
        fromName: "{{ template.from_name }}"
      response_mapping: { }

status_mapping:
  OK: SENT
  SENT: SENT
  queued: SENT
  delivered: DELIVERED
  failed: FAILED
  error: FAILED

retry_policy:
  max_attempts: 3
  backoff:
    type: exponential
    initial_seconds: 30
    max_seconds: 600

rate_limit:
  per_second: 10
  per_minute: 300