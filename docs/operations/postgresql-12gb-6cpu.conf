# PostgreSQL 16 starting profile: 12 GB RAM / 6 CPU, dedicated database host.
# Read cron-and-postgresql.md before applying, especially connection budgeting.
# If other services share this host, reduce the memory allocation first.

shared_buffers = '3GB'
effective_cache_size = '8GB'
work_mem = '8MB'
maintenance_work_mem = '512MB'
autovacuum_work_mem = '128MB'

# Enable only after budgeting ALL applications, replicas and rolling updates.
# max_connections = 200

checkpoint_completion_target = 0.9
checkpoint_timeout = '10min'
max_wal_size = '4GB'
min_wal_size = '1GB'
wal_compression = on
fsync = on
full_page_writes = on
synchronous_commit = on

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# Optional, only for verified SSD/NVMe storage; leave unchanged for unknown disks.
# random_page_cost = 1.1
# effective_io_concurrency = 200

# Append to existing shared_preload_libraries instead of overwriting it.
# shared_preload_libraries = 'pg_stat_statements'
# track_io_timing = on
# log_min_duration_statement = '500ms'
