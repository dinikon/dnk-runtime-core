{% load socialaccount %}
{% get_providers as providers %}
<div class="login-options">
{% for provider in providers %}
 {% if provider.id in available_providers or provider.sub_id in available_providers %}
 {% provider_login_url provider process=process as href %}
 <form class="provider-form" method="post" action="{{ href }}">
   {% csrf_token %}{{ redirect_field }}
   <button type="submit" class="button button-outline" {% if provider.sub_id == 'telegram' %}data-icon="telegram"{% endif %}>{% if process == 'connect' %}Подключить{% else %}Войти через{% endif %} {{ provider.name }}</button>
 </form>
 {% endif %}
{% endfor %}
</div>
