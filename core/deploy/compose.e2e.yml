# Apply only to a local browser-test run; restore the regular Compose configuration afterwards.
services:
  core:
    environment:
      # Existing password/WebAuthn browser flows also cover passwordless via overrides.
      CORE_AUTH_PASSWORD_MODE: ${CORE_E2E_AUTH_PASSWORD_MODE:-required}
      CORE_AUTH_USERNAME_MODE: generated
      CORE_EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
      CORE_EMAIL_FILE_PATH: /tmp/core-e2e-mail
      CORE_TELEGRAM_GATEWAY_ENABLED: "true"
      CORE_TELEGRAM_GATEWAY_TOKEN: browser-test-token-not-a-provider-credential
      CORE_AUTH_PHONE_LOGIN_MODE: ${CORE_E2E_AUTH_PHONE_LOGIN_MODE:-any_verified}
      CORE_AUTH_MAX_PHONE_NUMBERS: "5"
      DJANGO_SETTINGS_MODULE: tests.browser_settings
      PYTHONPATH: /app/src:/app
    volumes:
      - ./core/tests:/app/tests:ro
