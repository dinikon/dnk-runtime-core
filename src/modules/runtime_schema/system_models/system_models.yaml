version: "2026.03.12"
module: "crm"

objects:
  - key: "crm_lead"
    name:
      singular: "lead"
      plural: "leads"
    label:
      singular: "Lead"
      plural: "Leads"
    description: "Lead aggregate from CRM domain."
    fields:
      - name: "id"
        type: "uuid"
        label: "ID"
        is_nullable: false
        is_unique: true
        is_index: true
        is_ui_read_only: true
        is_searchable: false
      - name: "title"
        type: "string"
        label: "Title"
        description: "Lead title from LeadTitleVO."
        is_nullable: false
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: true
        settings:
          min_length: 1
          max_length: 255
      - name: "person_name"
        type: "full_name"
        label: "Person Name"
        description: "Optional person name (last, middle, first)."
        is_nullable: true
        is_unique: false
        is_index: false
        is_ui_read_only: false
        is_searchable: false
        settings:
          require_last_name: false
          require_middle_name: false
          require_first_name: true
      - name: "company_name"
        type: "string"
        label: "Company Name"
        description: "Optional company name from CompanyNameVO."
        is_nullable: true
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: true
        settings:
          min_length: 1
          max_length: 255
      - name: "contact_points"
        type: "relation"
        label: "Contact Points"
        description: "Collection of lead contact points."
        is_nullable: true
        is_unique: false
        is_index: false
        is_ui_read_only: false
        is_searchable: false
        relation_target_object: "crm_contact_point"
        relation_target_field: "id"
        settings:
          on_delete: "cascade"
          max_links: null
          enforce_tenant_scope: true
      - name: "product_rows"
        type: "relation"
        label: "Product Rows"
        description: "Collection of lead product rows."
        is_nullable: true
        is_unique: false
        is_index: false
        is_ui_read_only: false
        is_searchable: false
        relation_target_object: "crm_product_row"
        relation_target_field: "id"
        settings:
          on_delete: "cascade"
          max_links: null
          enforce_tenant_scope: true

  - key: "crm_contact"
    name:
      singular: "contact"
      plural: "contacts"
    label:
      singular: "Contact"
      plural: "Contacts"
    description: "Contact aggregate from CRM domain."
    fields:
      - name: "id"
        type: "uuid"
        label: "ID"
        is_nullable: false
        is_unique: true
        is_index: true
        is_ui_read_only: true
        is_searchable: false
      - name: "name"
        type: "full_name"
        label: "Name"
        description: "Contact full name from PersonNameVO."
        is_nullable: false
        is_unique: false
        is_index: false
        is_ui_read_only: false
        is_searchable: false
        settings:
          require_last_name: false
          require_middle_name: false
          require_first_name: true
      - name: "contact_points"
        type: "relation"
        label: "Contact Points"
        description: "Collection of contact points."
        is_nullable: true
        is_unique: false
        is_index: false
        is_ui_read_only: false
        is_searchable: false
        relation_target_object: "crm_contact_point"
        relation_target_field: "id"
        settings:
          on_delete: "cascade"
          max_links: null
          enforce_tenant_scope: true
      - name: "custom_note"
        type: "string"
        label: "Custom Note"
        description: "Custom free-form text field for contact."
        is_nullable: true
        is_unique: false
        is_index: false
        is_ui_read_only: false
        is_searchable: true
        settings:
          min_length: 1
          max_length: 255
      - name: "custom_budget"
        type: "currency"
        label: "Custom Budget"
        description: "Custom currency field for contact."
        is_nullable: true
        is_unique: false
        is_index: false
        is_ui_read_only: false
        is_searchable: false
        settings:
          allowed_currencies: ["USD", "EUR", "GBP", "UAH", "PLN"]
          display_scale: 2
      - name: "custom_source"
        type: "select"
        label: "Custom Source"
        description: "Custom select field for contact source."
        is_nullable: true
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: false
        options:
          items:
            - code: "web"
              label: "Web"
            - code: "referral"
              label: "Referral"
            - code: "event"
              label: "Event"
          allow_custom: false
      - name: "deal_id"
        type: "relation"
        label: "Deal"
        description: "Many contacts to one deal relation."
        is_nullable: true
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: false
        relation_target_object: "crm_deal"
        relation_target_field: "id"
        settings:
          on_delete: "set_null"
          max_links: 1
          enforce_tenant_scope: true

