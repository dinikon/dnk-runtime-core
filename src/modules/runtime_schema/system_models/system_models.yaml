version: "2026.03.12"
module: "crm"

objects:
  - key: "crm_contact"
    name:
      singular: "contact"
      plural: "contacts"
    label:
      singular: "Contact"
      plural: "Contacts"
    description: "Contact aggregate from CRM domain."
    fields:
      - name: "id"
        type: "uuid"
        label: "ID"
        is_nullable: false
        is_unique: true
        is_index: true
        is_ui_read_only: true
        is_searchable: false
      - name: "name"
        type: "full_name"
        label: "Name"
        description: "Contact full name from PersonNameVO."
        is_nullable: false
        is_unique: false
        is_index: false
        is_ui_read_only: false
        is_searchable: false
        settings:
          require_last_name: false
          require_middle_name: false
          require_first_name: true