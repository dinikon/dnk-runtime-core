            - code: "email"
              label: "Email"
            - code: "site"
              label: "Site"
            - code: "messenger"
              label: "Messenger"
          allow_custom: false
      - name: "value"
        type: "string"
        label: "Value"
        description: "Raw contact value, validated by business services."
        is_nullable: false
        is_unique: false
        is_index: false
        is_ui_read_only: false
        is_searchable: true
        settings:
          min_length: 1
          max_length: 512
      - name: "type_code"
        type: "string"
        label: "Type Code"
        description: "Dictionary code (work, mobile, personal, telegram)."
        is_nullable: false
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: false
        settings:
          min_length: 1
          max_length: 64
      - name: "is_primary"
        type: "boolean"
        label: "Is Primary"
        is_nullable: false
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: false
        default_value:
          value: false
      - name: "is_verified"
        type: "boolean"
        label: "Is Verified"
        is_nullable: false
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: false
        default_value:
          value: false
      - name: "sort_order"
        type: "integer"
        label: "Sort Order"
        is_nullable: false
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: false
        settings:
          min_value: 0
        default_value:
          value: 0
      - name: "is_active"
        type: "boolean"
        label: "Is Active"
        is_nullable: false
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: false
        default_value:
          value: true
      - name: "entity_name"
        type: "select"
        label: "Entity Name"
        description: "Owner aggregate name for ContactPoint: lead, contact, company."
        is_nullable: false
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: false
        options:
          items:
            - code: "lead"
              label: "Lead"
            - code: "contact"
              label: "Contact"
            - code: "company"
              label: "Company"
          allow_custom: false
      - name: "entity_uuid"
        type: "uuid"
        label: "Entity UUID"
        description: "Owner aggregate identifier paired with entity_name."
        is_nullable: false
        is_unique: false
        is_index: true
        is_ui_read_only: false
        is_searchable: false

