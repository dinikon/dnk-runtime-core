version: "2026.03.12"
module: "crm"

objects:
  - key: "crm_contact"
    name:
      singular: "contact"
      plural: "contacts"
    label:
      singular: "Contact"
      plural: "Contacts"
    description: "Contact aggregate from CRM domain."
    fields:
      - name: "id"
        type: "uuid"
        label: "ID"
        is_nullable: false
        is_unique: true
        is_index: true
        is_searchable: false

      - name: "created_at"
        type: "date_time"
        label: "Created At"
        is_nullable: false
        is_unique: false
        is_index: true
        is_searchable: false
        settings:
          timezone_aware: true
          require_utc: true
        default_value:
          value: "now"

      - name: "updated_at"
        type: "date_time"
        label: "Updated At"
        is_nullable: false
        is_unique: false
        is_index: true
        is_searchable: false
        settings:
          timezone_aware: true
          require_utc: true
        default_value:
          value: "now"

      - name: "name"
        type: "full_name"
        label: "Name"
        description: "Contact full name from PersonNameVO."
        is_nullable: false
        is_unique: false
        is_index: false
        is_searchable: false
        settings:
          require_last_name: false
          require_middle_name: false
          require_first_name: true
