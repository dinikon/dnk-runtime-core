  - key: "crm_contact_point"
    name:
      singular: "contact_point"
      plural: "contact_points"
    label:
      singular: "Contact Point"
      plural: "Contact Points"
    description: "Child entity for phones, emails, links and messengers."
    fields:
      - name: "id"
        type: "uuid"
        label: "ID"
        is_nullable: false
        is_unique: true
        is_index: true
