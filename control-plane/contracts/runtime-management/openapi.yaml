openapi: 3.1.0
info:
  title: DNK Runtime Management API
  version: 1.0.0
  description: |
    Installation-local management contract. The agent transports signed Control
    Plane commands; Runtime validates them independently and executes them
    idempotently. This contract supersedes the legacy shared-key endpoint once
    Runtime provisioning is implemented.
servers:
  - url: https://runtime.internal
    description: Installation-local placeholder
security:
  - SignedManagementRequest: []
paths:
  /management/v1/commands/{command_id}/execute:
    post:
      operationId: executeRuntimeCommand
      summary: Validate and execute a compact JWS command
      description: |
        Authorization contains `DnkCommand <compact-jws>`. The decoded protected
        header must match `JwsProtectedHeader`; decoded claims must match
        `RuntimeCommandClaims`. The path ID, JWS command ID and Idempotency-Key
        must agree.
      parameters:
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Command completed or a stored result replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandExecutionResult' }
              example:
                command_id: 0190f7e2-8000-7000-8000-000000000101
                status: SUCCEEDED
                replayed: false
                payload_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                started_at: '2026-07-11T12:00:01Z'
                completed_at: '2026-07-11T12:00:03Z'
                result:
                  local_tenant_id: 0190f7e2-8000-7000-8000-000000000201
        '202':
          description: An equivalent command is already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandExecutionAccepted' }
              example:
                command_id: 0190f7e2-8000-7000-8000-000000000101
                status: RUNNING
                retry_after_seconds: 3
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
      x-jws-protected-schema: '#/components/schemas/JwsProtectedHeader'
      x-jws-payload-schema: '#/components/schemas/RuntimeCommandClaims'
      x-error-codes:
        - COMMAND_SIGNATURE_INVALID
        - COMMAND_SIGNATURE_EXPIRED
        - COMMAND_SIGNATURE_KEY_UNKNOWN
        - COMMAND_AUDIENCE_INVALID
        - INSTALLATION_MISMATCH
        - COMMAND_PAYLOAD_DIGEST_MISMATCH
        - IDEMPOTENCY_CONFLICT
        - COMMAND_IN_PROGRESS
        - INVALID_STATE_TRANSITION
      x-jws-example:
        protected:
          alg: EdDSA
          kid: cp-signing-key-2026-01
          typ: dnk-command+jws
        claims:
          command_id: 0190f7e2-8000-7000-8000-000000000101
          operation_id: 0190f7e2-8000-7000-8000-000000000102
          installation_id: 0190f7e2-8000-7000-8000-000000000103
          command_type: CREATE_TENANT
          schema_version: 1
          issued_at: '2026-07-11T12:00:00Z'
          expires_at: '2026-07-11T12:05:00Z'
          audience: dnk-runtime-management
          idempotency_key: 0190f7e2-8000-7000-8000-000000000101
          payload_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          payload:
            external_tenant_id: 0190f7e2-8000-7000-8000-000000000104
            name: Acme
            primary_domain: acme.example.com
            admin:
              first_name: Jane
              last_name: Doe
              email: jane@example.com

  /management/v1/commands/{command_id}:
    get:
      operationId: getRuntimeCommand
      summary: Get the stored idempotency state and result for a command
      parameters:
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: Stored command state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandExecutionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /management/v1/installation/capabilities:
    get:
      operationId: getRuntimeCapabilities
      summary: Describe supported management commands and schema versions
      responses:
        '200':
          description: Runtime capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /management/v1/installation/health:
    get:
      operationId: getRuntimeHealth
      summary: Get installation-local Runtime health
      responses:
        '200':
          description: Runtime health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /management/v1/installation/version:
    get:
      operationId: getRuntimeVersion
      summary: Get Runtime and management contract versions
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    SignedManagementRequest:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `DnkCommand <compact-jws>` for command execution or a short-lived signed
        `DnkManagement` request for read-only management endpoints.

  parameters:
    CommandId:
      name: command_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Must equal the idempotency key in the signed claims.

  responses:
    BadRequest:
      description: Malformed request or command envelope
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Signature, key, audience or expiry validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Signed identity does not match this installation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Command not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Idempotency or lifecycle conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    UnprocessableEntity:
      description: Decoded command claims or payload are invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ServiceUnavailable:
      description: Runtime is not ready to serve management operations
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]+$' }
        request_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        command_id: { type: string, format: uuid }
        retryable: { type: boolean }

    JwsProtectedHeader:
      type: object
      additionalProperties: false
      required: [alg, kid, typ]
      properties:
        alg: { type: string, const: EdDSA }
        kid: { type: string, minLength: 1, maxLength: 128 }
        typ: { type: string, const: dnk-command+jws }

    CommonCommandClaims:
      type: object
      required:
        - command_id
        - operation_id
        - installation_id
        - command_type
        - schema_version
        - issued_at
        - expires_at
        - audience
        - idempotency_key
        - payload_sha256
        - payload
      properties:
        command_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        installation_id: { type: string, format: uuid }
        command_type:
          type: string
          enum:
            - CREATE_TENANT
            - SUSPEND_TENANT
            - RESUME_TENANT
            - DELETE_TENANT
            - UPSERT_DOMAIN
            - DELETE_DOMAIN
        schema_version: { type: integer, const: 1 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        audience: { type: string, const: dnk-runtime-management }
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        payload_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        payload: { type: object }

    RuntimeCommandClaims:
      oneOf:
        - $ref: '#/components/schemas/CreateTenantCommand'
        - $ref: '#/components/schemas/SuspendTenantCommand'
        - $ref: '#/components/schemas/ResumeTenantCommand'
        - $ref: '#/components/schemas/DeleteTenantCommand'
        - $ref: '#/components/schemas/UpsertDomainCommand'
        - $ref: '#/components/schemas/DeleteDomainCommand'
      discriminator:
        propertyName: command_type
        mapping:
          CREATE_TENANT: '#/components/schemas/CreateTenantCommand'
          SUSPEND_TENANT: '#/components/schemas/SuspendTenantCommand'
          RESUME_TENANT: '#/components/schemas/ResumeTenantCommand'
          DELETE_TENANT: '#/components/schemas/DeleteTenantCommand'
          UPSERT_DOMAIN: '#/components/schemas/UpsertDomainCommand'
          DELETE_DOMAIN: '#/components/schemas/DeleteDomainCommand'

    CreateTenantCommand:
      allOf:
        - $ref: '#/components/schemas/CommonCommandClaims'
        - type: object
          properties:
            command_type: { const: CREATE_TENANT }
            payload: { $ref: '#/components/schemas/CreateTenantPayload' }

    SuspendTenantCommand:
      allOf:
        - $ref: '#/components/schemas/CommonCommandClaims'
        - type: object
          properties:
            command_type: { const: SUSPEND_TENANT }
            payload: { $ref: '#/components/schemas/TenantStatePayload' }

    ResumeTenantCommand:
      allOf:
        - $ref: '#/components/schemas/CommonCommandClaims'
        - type: object
          properties:
            command_type: { const: RESUME_TENANT }
            payload: { $ref: '#/components/schemas/TenantStatePayload' }

    DeleteTenantCommand:
      allOf:
        - $ref: '#/components/schemas/CommonCommandClaims'
        - type: object
          properties:
            command_type: { const: DELETE_TENANT }
            payload: { $ref: '#/components/schemas/DeleteTenantPayload' }

    UpsertDomainCommand:
      allOf:
        - $ref: '#/components/schemas/CommonCommandClaims'
        - type: object
          properties:
            command_type: { const: UPSERT_DOMAIN }
            payload: { $ref: '#/components/schemas/UpsertDomainPayload' }

    DeleteDomainCommand:
      allOf:
        - $ref: '#/components/schemas/CommonCommandClaims'
        - type: object
          properties:
            command_type: { const: DELETE_DOMAIN }
            payload: { $ref: '#/components/schemas/DeleteDomainPayload' }

    CreateTenantPayload:
      type: object
      additionalProperties: false
      required: [external_tenant_id, name, primary_domain, admin]
      properties:
        external_tenant_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        primary_domain: { type: string, minLength: 1, maxLength: 253 }
        configuration_revision: { type: integer, minimum: 1, default: 1 }
        admin:
          $ref: '#/components/schemas/TenantAdmin'

    TenantAdmin:
      type: object
      additionalProperties: false
      required: [first_name, last_name, email]
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 320 }

    TenantStatePayload:
      type: object
      additionalProperties: false
      required: [external_tenant_id, expected_lifecycle_version]
      properties:
        external_tenant_id: { type: string, format: uuid }
        expected_lifecycle_version: { type: integer, format: int64, minimum: 1 }

    DeleteTenantPayload:
      type: object
      additionalProperties: false
      required:
        - external_tenant_id
        - deletion_request_id
        - retention_expired_at
        - expected_lifecycle_version
      properties:
        external_tenant_id: { type: string, format: uuid }
        deletion_request_id: { type: string, format: uuid }
        retention_expired_at: { type: string, format: date-time }
        expected_lifecycle_version: { type: integer, format: int64, minimum: 1 }

    UpsertDomainPayload:
      type: object
      additionalProperties: false
      required:
        - external_tenant_id
        - external_domain_id
        - hostname
        - service_type
        - tls_mode
      properties:
        external_tenant_id: { type: string, format: uuid }
        external_domain_id: { type: string, format: uuid }
        hostname: { type: string, minLength: 1, maxLength: 253 }
        service_type: { type: string, enum: [CONSOLE, API] }
        tls_mode: { type: string, enum: [MANAGED, EXTERNAL] }
        is_primary: { type: boolean, default: false }

    DeleteDomainPayload:
      type: object
      additionalProperties: false
      required: [external_tenant_id, external_domain_id]
      properties:
        external_tenant_id: { type: string, format: uuid }
        external_domain_id: { type: string, format: uuid }

    CommandExecutionResult:
      type: object
      additionalProperties: false
      required: [command_id, status, replayed, payload_sha256]
      properties:
        command_id: { type: string, format: uuid }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED] }
        replayed: { type: boolean }
        payload_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        result:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/CommandError'

    CommandExecutionAccepted:
      type: object
      additionalProperties: false
      required: [command_id, status, retry_after_seconds]
      properties:
        command_id: { type: string, format: uuid }
        status: { type: string, const: RUNNING }
        retry_after_seconds: { type: integer, minimum: 1, maximum: 30 }

    CommandError:
      type: object
      additionalProperties: false
      required: [code, retryable]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]+$' }
        message: { type: string }
        retryable: { type: boolean }

    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [management_api_version, commands]
      properties:
        management_api_version: { type: string, const: '1.0' }
        commands:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [command_type, schema_versions]
            properties:
              command_type: { type: string }
              schema_versions:
                type: array
                minItems: 1
                items: { type: integer, minimum: 1 }

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, checked_at]
      properties:
        status: { type: string, enum: [ONLINE, DEGRADED] }
        checked_at: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties: { type: string }

    VersionResponse:
      type: object
      additionalProperties: false
      required: [runtime_version, management_api_version]
      properties:
        runtime_version: { type: string }
        management_api_version: { type: string, const: '1.0' }
