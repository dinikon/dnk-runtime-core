name: Build and publish
run-name: Publish ${{ github.ref_name }} · attempt ${{ github.run_attempt }}

on:
  push:
    branches: [develop, main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish images, chart and release
    if: github.ref_type == 'branch' && (github.ref_name == 'develop' || github.ref_name == 'main' || startsWith(github.ref_name, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      # RC numbering and channel aliases require one publisher per branch.
      group: cicd-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      BRANCH: ${{ github.ref_name }}
      PYTHONUNBUFFERED: '1'
      CICD_BUILD_CACHE: registry
    steps:
      - name: Check out source and release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'
      - name: Set up uv and restore dependency cache
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: '0.10.4'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - name: Prepare Git identity for Commitizen tags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        # pipefail preserves a failed publisher's exit status while tee keeps its log.
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen python -m scripts.cicd ci \
            --branch "$BRANCH" \
            --sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/publication.json" \
            2>&1 | tee "$RUNNER_TEMP/publication.log"
      - name: Save publication records and diagnostic log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication.json
            ${{ runner.temp }}/publications/*.json
            ${{ runner.temp }}/publication.log
          if-no-files-found: warn
          retention-days: 14
