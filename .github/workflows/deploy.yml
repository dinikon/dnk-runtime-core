name: Build and deliver

on:
  push:
    branches: [develop, main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref_type == 'branch' && (github.ref_name == 'develop' || github.ref_name == 'main' || startsWith(github.ref_name, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: cicd-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: '0.10.4'
      - run: uv sync --frozen
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - name: Prepare Git identity for Commitizen tags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish versioned artifacts
        run: uv run --frozen python -m scripts.cicd ci --branch "$BRANCH" --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/publication.json"
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'develop' || github.ref_name == 'main'
        with:
          name: publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: error
          overwrite: true

  deliver:
    needs: publish
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    concurrency:
      group: cicd-delivery-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
      ARGOCD_APP: ${{ vars.ARGOCD_APP }}
      ARGOCD_VERSION: ${{ vars.ARGOCD_VERSION }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delivery remains disabled until explicitly configured
        if: env.DEPLOY_ENABLED != 'true'
        run: echo 'Artifacts prepared. No ArgoCD calls, dev alias updates or deployments.'
      - uses: actions/checkout@v7
        if: env.DEPLOY_ENABLED == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        if: env.DEPLOY_ENABLED == 'true'
        with:
          python-version: '3.13.9'
      - uses: astral-sh/setup-uv@v8.2.0
        if: env.DEPLOY_ENABLED == 'true'
        with:
          version: '0.10.4'
      - if: env.DEPLOY_ENABLED == 'true'
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        if: env.DEPLOY_ENABLED == 'true'
        with:
          name: publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication
      - uses: docker/login-action@v3
        if: env.DEPLOY_ENABLED == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: oras-project/setup-oras@v1
        if: env.DEPLOY_ENABLED == 'true'
        with:
          version: '1.3.0'
      - name: Install the configured ArgoCD CLI
        if: env.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          [[ "$ARGOCD_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Set ARGOCD_VERSION to the server release, for example v3.x.y'; exit 1; }
          gh release download "$ARGOCD_VERSION" --repo argoproj/argo-cd --pattern argocd-linux-amd64 --pattern cli_checksums.txt --dir "$RUNNER_TEMP/argocd"
          cd "$RUNNER_TEMP/argocd"
          awk '$2 == "argocd-linux-amd64" {print}' cli_checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          mkdir -p "$HOME/.local/bin"
          install -m 755 argocd-linux-amd64 "$HOME/.local/bin/argocd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deliver and wait for migrations and rollout
        if: env.DEPLOY_ENABLED == 'true'
        run: uv run --frozen python -m scripts.cicd deliver --publication "$RUNNER_TEMP/publication/publication.json"
