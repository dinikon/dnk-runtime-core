name: Build and publish

on:
  push:
    branches: [develop, main, 'release/**']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.ref_type == 'branch' && (github.ref_name == 'develop' || github.ref_name == 'main' || startsWith(github.ref_name, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: cicd-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: '0.10.4'
      - run: uv sync --frozen
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - name: Prepare Git identity for Commitizen tags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish versioned artifacts
        run: uv run --frozen python -m scripts.cicd ci --branch "$BRANCH" --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/publication.json"
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'develop' || github.ref_name == 'main'
        with:
          name: publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: error
          overwrite: true
