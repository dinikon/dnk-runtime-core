name: helm

on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'deploy/argocd/**'
      - 'core/**'
      - 'src/**'
      - 'migrations/**'
      - 'frontends/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/helm.yml'
  push:
    branches: [develop, pre-release, release, main, 'feature/**', 'bug-fix/**']
    paths:
      - 'deploy/helm/**'
      - 'deploy/argocd/**'
      - 'core/**'
      - 'src/**'
      - 'migrations/**'
      - 'frontends/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/helm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: python -m pip install PyYAML==6.0.3 SQLAlchemy==2.0.48
      - name: Prepare local dependencies and package all three entrypoints
        run: python deploy/helm/build.py --destination dist/helm
      - name: Lint, strict YAML, schemas, lifecycle and runtime script contracts
        run: python -m unittest discover -s deploy/helm/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: dnk-platform-helm
          path: dist/helm/*.tgz
          if-no-files-found: error

  kubernetes-smoke:
    needs: charts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.1
      - name: Install kind
        run: |
          curl --fail --location --silent --show-error https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64 -o /tmp/kind
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - run: python -m pip install PyYAML==6.0.3 SQLAlchemy==2.0.48
      - run: python deploy/helm/build.py
      - name: Build local images and verify Helm, Ingress, certificates, Jobs, HTTPS and persistence in disposable Kubernetes
        run: python deploy/helm/tests/smoke.py --system-ingress
      - name: Runtime transactional migration integration
        run: python deploy/helm/tests/runtime_migrations_integration.py --runtime-image dnk-test/runtime:helm-test
      - name: Verify real ArgoCD waves, full Sync, selfHeal and migration failures
        run: python deploy/helm/tests/argocd_smoke.py --reuse-test-images
