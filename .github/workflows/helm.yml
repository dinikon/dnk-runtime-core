name: helm

on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'core/**'
      - 'frontends/**'
      - '.github/workflows/helm.yml'
  push:
    branches: [develop, pre-release, release, main, 'feature/**', 'bug-fix/**']
    paths:
      - 'deploy/helm/**'
      - 'core/**'
      - 'frontends/**'
      - '.github/workflows/helm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: python -m pip install PyYAML==6.0.3
      - name: Lint, render, validate and package umbrella and standalone charts
        run: python -m unittest discover -s deploy/helm/tests -p 'test_*.py' -v

  kubernetes-smoke:
    needs: charts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.1
      - name: Install kind
        run: |
          curl --fail --location --silent --show-error https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64 -o /tmp/kind
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - run: python -m pip install PyYAML==6.0.3
      - name: Build images and verify install, upgrade, HTTPS and persistence in disposable Kubernetes
        run: python deploy/helm/tests/smoke.py
