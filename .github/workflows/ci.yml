name: ci

on:
  pull_request:
    branches:
      - develop
      - pre-release
      - release
      - main
  push:
    branches:
      - develop
      - "feature/**"
      - "bug-fix/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: inventory_test
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:inventory_test@127.0.0.1:5432/inventory_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.10.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare test environment
        run: cp temaplate.dev.env .env

      - name: Compile source
        run: uv run python -m compileall src migrations

      - name: Check formatting
        run: uv run black --check src test migrations

      - name: Run tests
        run: uv run python -m unittest discover -s test -p "test_*.py" -v

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontends/package-lock.json
      - run: npm ci
      - run: npm run lint:console
      - run: npm run typecheck:console
      - run: npm run build:console
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64'
