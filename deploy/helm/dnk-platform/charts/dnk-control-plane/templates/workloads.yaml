{{- $root := . -}}
{{- $fullname := include "dnk.controlPlane.fullname" . -}}
{{- range $component := list "backend" "frontend" "gateway" -}}
{{- $workload := index $root.Values $component -}}
{{- $port := index (dict "backend" 8001 "frontend" 3000 "gateway" 80) $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $component }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "dnk.controlPlane.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $workload.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dnk-control-plane
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dnk-control-plane
        app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $workload.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        dnk.io/deployment-revision: {{ $root.Values.global.deployment.revision | quote }}
        dnk.io/deployment-token: {{ include "dnk.lifecycle.token" $root | quote }}
        checksum/migration-gate: {{ include "dnk.lifecycle.gateScript" $root | sha256sum }}
        {{- with $workload.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if eq $component "backend" }}
        checksum/config: {{ include "dnk.controlPlane.config" $root | sha256sum }}
        checksum/credentials: {{ include "dnk.controlPlane.secretBindings" $root | sha256sum }}
        {{- else if eq $component "gateway" }}
        checksum/config: {{ include (print $root.Template.BasePath "/gateway-configmap.yaml") $root | sha256sum }}
        {{- else }}
        checksum/config: {{ $root.Values.application.server.publicOrigin | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if include "dnk.lifecycle.gateEnabled" $root }}
      serviceAccountName: {{ include "dnk.lifecycle.serviceAccountName" $root }}
      {{- end }}
      {{- with concat $root.Values.global.imagePullSecrets $root.Values.backend.pod.imagePullSecrets $workload.pod.imagePullSecrets | uniq }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.pod.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "dnk.lifecycle.gateEnabled" $root }}
      initContainers:
        {{- include "dnk.lifecycle.gate" $root | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ printf "%s:%s" $workload.image.repository $workload.image.tag | quote }}
          imagePullPolicy: {{ $workload.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $port }}
          {{- if eq $component "backend" }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          env:
            {{- include "dnk.controlPlane.secretEnv" $root | nindent 12 }}
            {{- with $root.Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else if eq $component "frontend" }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: NUXT_PUBLIC_SITE_URL
              value: {{ $root.Values.application.server.publicOrigin | quote }}
          {{- end }}
          {{- range $probe := list "startup" "readiness" "liveness" }}
          {{ $probe }}Probe:
            httpGet:
              path: {{ index (dict "backend" "/api/capabilities/" "frontend" "/" "gateway" "/_healthz") $component }}
              port: http
              {{- if eq $component "backend" }}
              httpHeaders:
                - name: Host
                  value: {{ include "dnk.controlPlane.hostname" $root | quote }}
                - name: X-Forwarded-Proto
                  value: "https"
              {{- end }}
            {{- toYaml (index $workload.probes $probe) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $workload.resources | nindent 12 }}
          {{- with $workload.pod.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $component "gateway" }}
            - name: gateway-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- end }}
      volumes:
        {{- include "dnk.lifecycle.gateVolumes" $root | nindent 8 }}
        - name: tmp
          emptyDir: {}
        {{- if eq $component "gateway" }}
        - name: gateway-config
          configMap:
            name: {{ $fullname }}-gateway
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $component }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "dnk.controlPlane.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ $workload.service.type }}
  ports:
    - name: http
      port: {{ $workload.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: dnk-control-plane
    app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}
