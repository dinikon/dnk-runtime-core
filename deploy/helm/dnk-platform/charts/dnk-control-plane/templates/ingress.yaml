{{- if .Values.ingress.enabled }}
{{- $fullname := include "dnk.controlPlane.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "dnk.controlPlane.labels" . | nindent 4 }}
  annotations:
    {{- include "dnk.ingress.annotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - secretName: {{ include "dnk.ingress.tlsSecretName" . | quote }}
      hosts:
        - {{ include "dnk.controlPlane.hostname" . | quote }}
  rules:
    - host: {{ include "dnk.controlPlane.hostname" . | quote }}
      http:
        paths:
          {{- range $path := list "/api" "/accounts" "/admin" "/static" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-backend
                port:
                  number: {{ $.Values.backend.service.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
