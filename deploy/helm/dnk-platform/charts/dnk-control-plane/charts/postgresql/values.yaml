global:
  imagePullSecrets: []
# Disable this dependency in the application chart to connect to external PostgreSQL.
enabled: true
nameOverride: control-plane-postgresql
fullnameOverride: ""

image:
  repository: postgres
  tag: 16-alpine
  pullPolicy: IfNotPresent

auth:
  database: dniko
  username: core
  # Choose exactly one source. Existing Secrets must be in the release namespace.
  # Changing this value does not rotate credentials in an initialized database.
  password:
    value: ""
    existingSecret:
      name: ""
      key: ""

external:
  host: ""
  port: 5432

persistence:
  enabled: true
  size: 8Gi
  # null uses the cluster default; "" explicitly requests no StorageClass.
  storageClass: null
  # Reuse an existing writable ReadWriteOnce PVC instead of creating a claim.
  existingClaim: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

pod:
  annotations: {}
  labels: {}
  # Official postgres:16-alpine uses UID/GID 70. Adjust for another image family.
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  imagePullSecrets: []
