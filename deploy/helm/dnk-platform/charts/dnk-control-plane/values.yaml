# Control Plane values: this file is also usable without the umbrella chart.
# Required before install: publicOrigin, signing/Fernet keys, DB/Redis passwords.
# Secrets: supply value OR existingSecret.name/key, never both. Never commit real credentials.
# Production expects an existing HTTPS ingress/proxy and external SMTP.
# Each workload has its own image, scaling, resources, probes and pod scheduling.
# Existing Secrets are not watched: restart the affected workloads after external rotation.
global:
  deployment:
    revision: ""
  imagePullSecrets: []
  # Internal coordinator: set by the umbrella chart; leave empty standalone.
  migrations:
    coordinator: ""
enabled: true
nameOverride: dnk-control-plane
fullnameOverride: ''
# Product settings; translated to CORE_* only for Django.
application:
  server:
    publicOrigin: ''
    debug: false
    allowedHosts: []
    trustProxy: true
    trustedProxyCount: 2
    languageCode: ru
    timeZone: UTC
  security:
    secretKey:
      value: ''
      existingSecret:
        name: ''
        key: ''
  auth:
    usernameMode: generated
    passwordMode: passwordless
    signupEnabled: true
    emailCodeEnabled: true
    passkeyLoginEnabled: true
    passkeySignupEnabled: true
    phoneLoginMode: any_verified
    maxPhoneNumbers: 5
    code:
      timeout: 300
      maxAttempts: 3
      resendEnabled: true
    emailVerification:
      timeout: 900
      maxAttempts: 3
      maxResends: 2
  sessions:
    cookieAge: 1209600
    remember: auto
    reauthenticationTimeout: 300
    emailReauthentication:
      timeout: 300
      maxAttempts: 3
      resendWaitSeconds: 30
      maxPerHour: 5
  mfa:
    encryptionKey:
      value: ''
      existingSecret:
        name: ''
        key: ''
    totpEnrollmentEnabled: true
    passkeyEnrollmentEnabled: true
    totpIssuer: dNiko Alpha
  email:
    backend: django.core.mail.backends.smtp.EmailBackend
    host: ''
    port: 587
    username: ''
    password:
      value: ''
      existingSecret:
        name: ''
        key: ''
    useTls: true
    useSsl: false
    verifyCertificate: true
    timeout: 10
    filePath: ''
    from: ''
    subjectPrefix: '[dNiko Alpha] '
    notifications: true
  providers:
    google:
      enabled: auto
      clientId: ''
      clientSecret:
        value: ''
        existingSecret:
          name: ''
          key: ''
    github:
      enabled: auto
      clientId: ''
      clientSecret:
        value: ''
        existingSecret:
          name: ''
          key: ''
    telegramLogin:
      enabled: auto
      clientId: ''
      clientSecret:
        value: ''
        existingSecret:
          name: ''
          key: ''
    telegramGateway:
      enabled: auto
      token:
        value: ''
        existingSecret:
          name: ''
          key: ''
      timeout: 5
# Django image built using core/Dockerfile, repository root as build context.
backend:
  image:
    repository: ghcr.io/dinikon/runtime/core
    tag: latest
    pullPolicy: Always
  replicas: 1
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  pod:
    annotations: {}
    labels: {}
    securityContext: {}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []
  extraEnv: []
# Nuxt image: frontends/apps/core/Dockerfile, target runtime.
frontend:
  image:
    repository: ghcr.io/dinikon/runtime/frontend-core
    tag: latest
    pullPolicy: Always
  replicas: 1
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  pod:
    annotations: {}
    labels: {}
    securityContext: {}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []
# Official Nginx; proxy configuration is supplied by this chart.
gateway:
  image:
    repository: nginx
    tag: 1.27-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  pod:
    annotations: {}
    labels: {}
    securityContext: {}
    containerSecurityContext:
      allowPrivilegeEscalation: false
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []
# Existing controller and TLS Secret. Host comes from application.server.publicOrigin.
ingress:
  enabled: false
  className: ''
  annotations: {}
  tls:
    secretName: ''
# A retained Job runs on each Helm install/upgrade or full ArgoCD Sync.
# Disable only when migrations are managed externally; enabled sibling Jobs are still awaited.
migrations:
  enabled: true
  waitTimeoutSeconds: 300
  gateTimeoutSeconds: 900
  activeDeadlineSeconds: 600
  backoffLimit: 1
  resources: {}
# enabled=false selects external.host/port; auth is shared by the backend and embedded database.
# PVCs created by the StatefulSet survive uninstall. Changing values does not rotate database passwords.
postgresql:
  # Disable this dependency in the Control Plane chart to connect to external PostgreSQL.
  enabled: true
  nameOverride: control-plane-postgresql
  fullnameOverride: ""

  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent

  auth:
    database: dniko
    username: core
    # Choose exactly one source. Existing Secrets must be in the release namespace.
    # Changing this value does not rotate credentials in an initialized database.
    password:
      value: ""
      existingSecret:
        name: ""
        key: ""

  external:
    host: ""
    port: 5432

  persistence:
    enabled: true
    size: 8Gi
    # null uses the cluster default; "" explicitly requests no StorageClass.
    storageClass: null
    # Reuse an existing writable ReadWriteOnce PVC instead of creating a claim.
    existingClaim: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  pod:
    annotations: {}
    labels: {}
    # Official postgres:16-alpine uses UID/GID 70. Adjust for another image family.
    securityContext:
      runAsNonRoot: true
      runAsUser: 70
      runAsGroup: 70
      fsGroup: 70
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []

# Independently switch Redis to external mode without changing PostgreSQL.
redis:
  # Disable this dependency in the Control Plane chart to connect to external Redis.
  enabled: true
  nameOverride: control-plane-redis
  fullnameOverride: ""

  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent

  # Logical database used by the core application.
  database: 1
  auth:
    # Choose exactly one source. Existing Secrets must be in the release namespace.
    password:
      value: ""
      existingSecret:
        name: ""
        key: ""

  external:
    host: ""
    port: 6379
    # In external mode this alternative carries a complete redis:// or rediss:// URL.
    url:
      value: ""
      existingSecret:
        name: ""
        key: ""

  persistence:
    enabled: true
    size: 1Gi
    # null uses the cluster default; "" explicitly requests no StorageClass.
    storageClass: null
    # Reuse an existing writable ReadWriteOnce PVC instead of creating a claim.
    existingClaim: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  pod:
    annotations: {}
    labels: {}
    # Official redis:7-alpine uses UID 999 and GID 1000.
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []
