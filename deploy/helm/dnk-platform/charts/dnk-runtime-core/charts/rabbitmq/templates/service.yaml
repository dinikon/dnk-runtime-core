{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnk.rabbitmq.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    {{- include "dnk.rabbitmq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: rabbitmq
      port: 5672
      targetPort: rabbitmq
  selector:
    {{- include "dnk.rabbitmq.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnk.rabbitmq.headlessName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    {{- include "dnk.rabbitmq.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: rabbitmq
      port: 5672
      targetPort: rabbitmq
  selector:
    {{- include "dnk.rabbitmq.selectorLabels" . | nindent 4 }}
{{- end }}
