apiVersion: v2
name: dnk-runtime-core
description: DNK runtime API, Vue frontend, gateway and integration workers
type: application
version: 0.2.0
appVersion: 0.0.1
annotations:
  dnk.io/application-name: dnk-runtime-core
dependencies:
- name: dnk-common
  version: 0.2.0
  repository: file://../dnk-common
- name: postgresql
  version: 0.1.0
  condition: postgresql.enabled
- name: redis
  version: 0.1.0
  condition: redis.enabled
- name: rabbitmq
  version: 0.1.0
  condition: rabbitmq.enabled
