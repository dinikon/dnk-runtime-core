apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dnk.runtime.fullname" . }}-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  labels:
    {{- include "dnk.runtime.labels" . | nindent 4 }}
data:
  default.conf: |
    # The trusted ingress must overwrite client-supplied forwarded headers.
    map $http_x_forwarded_proto $runtime_forwarded_proto {
        default $scheme;
        http http;
        https https;
    }
    server {
        listen 80;
        server_name _;
        location = /_healthz { access_log off; return 200 "ok\n"; }
        location ~ ^/api(/|$) {
            proxy_pass http://{{ include "dnk.runtime.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $runtime_forwarded_proto;
            {{- if eq (urlParse .Values.application.server.publicOrigin).scheme "https" }}
            proxy_cookie_flags {{ .Values.application.auth.sessionCookieName }} secure httponly samesite=lax;
            {{- end }}
        }
        location / {
            proxy_pass http://{{ include "dnk.runtime.fullname" . }}-frontend:{{ .Values.frontend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $runtime_forwarded_proto;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dnk.runtime.fullname" . }}-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  labels:
    {{- include "dnk.runtime.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
    }
