# Install both applications by default; disable either group for a partial deployment.
# The same settings are available without these prefixes in the standalone charts.
global:
  deployment:
    # ArgoCD passes $ARGOCD_APP_REVISION; Helm also includes its release revision.
    revision: ""
  imagePullSecrets: []
  # Internal shared migration barrier; do not override in the umbrella chart.
  migrations:
    coordinator: dnk-platform


controlPlane:
  enabled: true
  nameOverride: dnk-control-plane
  fullnameOverride: ''
  # Product settings; translated to CORE_* only for Django.
  application:
    server:
      publicOrigin: ''
      debug: false
      allowedHosts: []
      trustProxy: true
      trustedProxyCount: 2
      languageCode: ru
      timeZone: UTC
    security:
      secretKey:
        value: ''
        existingSecret:
          name: ''
          key: ''
    auth:
      usernameMode: generated
      passwordMode: passwordless
      signupEnabled: true
      emailCodeEnabled: true
      passkeyLoginEnabled: true
      passkeySignupEnabled: true
      phoneLoginMode: any_verified
      maxPhoneNumbers: 5
      code:
        timeout: 300
        maxAttempts: 3
        resendEnabled: true
      emailVerification:
        timeout: 900
        maxAttempts: 3
        maxResends: 2
    sessions:
      cookieAge: 1209600
      remember: auto
      reauthenticationTimeout: 300
      emailReauthentication:
        timeout: 300
        maxAttempts: 3
        resendWaitSeconds: 30
        maxPerHour: 5
    mfa:
      encryptionKey:
        value: ''
        existingSecret:
          name: ''
          key: ''
      totpEnrollmentEnabled: true
      passkeyEnrollmentEnabled: true
      totpIssuer: dNiko Alpha
    email:
      backend: django.core.mail.backends.smtp.EmailBackend
      host: ''
      port: 587
      username: ''
      password:
        value: ''
        existingSecret:
          name: ''
          key: ''
      useTls: true
      useSsl: false
      verifyCertificate: true
      timeout: 10
      filePath: ''
      from: ''
      subjectPrefix: '[dNiko Alpha] '
      notifications: true
    providers:
      google:
        enabled: auto
        clientId: ''
        clientSecret:
          value: ''
          existingSecret:
            name: ''
            key: ''
      github:
        enabled: auto
        clientId: ''
        clientSecret:
          value: ''
          existingSecret:
            name: ''
            key: ''
      telegramLogin:
        enabled: auto
        clientId: ''
        clientSecret:
          value: ''
          existingSecret:
            name: ''
            key: ''
      telegramGateway:
        enabled: auto
        token:
          value: ''
          existingSecret:
            name: ''
            key: ''
        timeout: 5
  # Django image built using core/Dockerfile, repository root as build context.
  backend:
    image:
      repository: ghcr.io/dinikon/runtime/core
      tag: latest
      pullPolicy: Always
    replicas: 1
    service:
      type: ClusterIP
      port: 8001
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    probes:
      startup:
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      readiness:
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      liveness:
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
    extraEnv: []
  # Nuxt image: frontends/apps/core/Dockerfile, target runtime.
  frontend:
    image:
      repository: ghcr.io/dinikon/runtime/frontend-core
      tag: latest
      pullPolicy: Always
    replicas: 1
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    probes:
      startup:
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      readiness:
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      liveness:
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
  # Official Nginx; proxy configuration is supplied by this chart.
  gateway:
    image:
      repository: nginx
      tag: 1.27-alpine
      pullPolicy: IfNotPresent
    replicas: 1
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    probes:
      startup:
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      readiness:
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      liveness:
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
  # Existing controller and TLS Secret. Host comes from application.server.publicOrigin.
  ingress:
    enabled: false
    className: ''
    annotations: {}
    tls:
      secretName: ''
  # A retained Job runs on each Helm install/upgrade or full ArgoCD Sync.
  # Disable only when migrations are managed externally; enabled sibling Jobs are still awaited.
  migrations:
    enabled: true
    waitTimeoutSeconds: 300
    gateTimeoutSeconds: 900
    activeDeadlineSeconds: 600
    backoffLimit: 1
    resources: {}
  # enabled=false selects external.host/port; auth is shared by the backend and embedded database.
  # PVCs created by the StatefulSet survive uninstall. Changing values does not rotate database passwords.
  postgresql:
    # Disable this dependency in the Control Plane chart to connect to external PostgreSQL.
    enabled: true
    nameOverride: control-plane-postgresql
    fullnameOverride: ""

    image:
      repository: postgres
      tag: 16-alpine
      pullPolicy: IfNotPresent

    auth:
      database: dniko
      username: core
      # Choose exactly one source. Existing Secrets must be in the release namespace.
      # Changing this value does not rotate credentials in an initialized database.
      password:
        value: ""
        existingSecret:
          name: ""
          key: ""

    external:
      host: ""
      port: 5432

    persistence:
      enabled: true
      size: 8Gi
      # null uses the cluster default; "" explicitly requests no StorageClass.
      storageClass: null
      # Reuse an existing writable ReadWriteOnce PVC instead of creating a claim.
      existingClaim: ""

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    pod:
      annotations: {}
      labels: {}
      # Official postgres:16-alpine uses UID/GID 70. Adjust for another image family.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []

  # Independently switch Redis to external mode without changing PostgreSQL.
  redis:
    # Disable this dependency in the Control Plane chart to connect to external Redis.
    enabled: true
    nameOverride: control-plane-redis
    fullnameOverride: ""

    image:
      repository: redis
      tag: 7-alpine
      pullPolicy: IfNotPresent

    # Logical database used by the core application.
    database: 1
    auth:
      # Choose exactly one source. Existing Secrets must be in the release namespace.
      password:
        value: ""
        existingSecret:
          name: ""
          key: ""

    external:
      host: ""
      port: 6379
      # In external mode this alternative carries a complete redis:// or rediss:// URL.
      url:
        value: ""
        existingSecret:
          name: ""
          key: ""

    persistence:
      enabled: true
      size: 1Gi
      # null uses the cluster default; "" explicitly requests no StorageClass.
      storageClass: null
      # Reuse an existing writable ReadWriteOnce PVC instead of creating a claim.
      existingClaim: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

    pod:
      annotations: {}
      labels: {}
      # Official redis:7-alpine uses UID 999 and GID 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []

runtime:
  enabled: true
  nameOverride: dnk-runtime-core
  fullnameOverride: ''
  # Runtime settings are translated into the environment expected by the published image.
  # Set HTTPS publicOrigin, the API key and a working SMTP server before installing.
  application:
    server:
      publicOrigin: ''
      environment: PRODUCTION
    security:
      controlPlaneApiKey:
        value: ''
        existingSecret:
          name: ''
          key: ''
    tenancy:
      schemaPrefix: dnk_
    auth:
      otpCodeLength: 6
      otpTokenTtlSeconds: 300
      sessionTtlSeconds: 432000
      sessionCookieName: dnk_session
    email:
      provider: smtp
      fromAddress: ''
      fromName: DNK Runtime
      smtp:
        host: ''
        port: 587
        username: ''
        password:
          value: ''
          existingSecret:
            name: ''
            key: ''
        useTls: false
        useStarttls: true
        timeoutSeconds: 10
    database:
      charset: ''
      extras: ''
      pool:
        size: 30
        maxOverflow: 10
        recycleSeconds: 3600
        useLifo: false
        prePing: true
      echo: false
      startup:
        maxAttempts: 5
        retryDelaySeconds: 1
      retrievalServiceExecutors: 4
    events:
      enabled: true
      publisherConfirms: true
      prefetch: 20
      exchangeName: dnk.integration.events
      publishLimit: 100
      retryBaseSeconds: 30
      maxAttempts: 5
      publisherIdleSleepSeconds: 0.5
      publisherErrorSleepSeconds: 5
    scheduledJobs:
      processLimit: 100
      recoverLimit: 100
      lockTtlSeconds: 300
      retryBaseSeconds: 30
      maxAttempts: 5
  # Published FastAPI image. latest is always pulled when a new pod starts.
  # extraEnv permits valueFrom but cannot replace chart-managed variables.
  backend:
    image:
      repository: ghcr.io/dinikon/runtime/runtime
      tag: latest
      pullPolicy: Always
    replicas: 1
    service:
      type: ClusterIP
      port: 8000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    probes:
      startup:
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      readiness:
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      liveness:
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
    extraEnv: []
  # Published static Vue frontend; chart mounts its static Nginx configuration.
  frontend:
    image:
      repository: ghcr.io/dinikon/runtime/frontend-runtime
      tag: latest
      pullPolicy: Always
    replicas: 1
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    probes:
      startup:
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      readiness:
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      liveness:
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
  # Official Nginx routes /api to FastAPI and everything else to the Vue frontend.
  gateway:
    image:
      repository: nginx
      tag: 1.27-alpine
      pullPolicy: IfNotPresent
    replicas: 1
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    probes:
      startup:
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      readiness:
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      liveness:
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
  # Workers inherit the backend environment; each has independent image/resources/placement.
  # Console worker is an optional event diagnostic consumer. No scheduled CronJobs are deployed.
  workers:
    publisher:
      image:
        repository: ghcr.io/dinikon/runtime/runtime
        tag: latest
        pullPolicy: Always
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      probes: {}
      pod:
        annotations: {}
        labels: {}
        securityContext: {}
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        nodeSelector: {}
        tolerations: []
        affinity: {}
        imagePullSecrets: []
      enabled: true
    console:
      image:
        repository: ghcr.io/dinikon/runtime/runtime
        tag: latest
        pullPolicy: Always
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      probes: {}
      pod:
        annotations: {}
        labels: {}
        securityContext: {}
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        nodeSelector: {}
        tolerations: []
        affinity: {}
        imagePullSecrets: []
      enabled: false
      queueName: dnk.integration.console
      routingKey: '#'
  # Supply the ingress controller and an existing TLS Secret. Host is derived from publicOrigin.
  ingress:
    enabled: false
    className: ''
    annotations: {}
    tls:
      secretName: ''
  # A retained Sync Job runs before workloads; every workload waits for all coordinator Jobs.
  # Disable only when migrations are managed outside this chart.
  migrations:
    enabled: true
    waitTimeoutSeconds: 300
    gateTimeoutSeconds: 900
    activeDeadlineSeconds: 600
    backoffLimit: 1
    resources: {}
  # enabled=false selects an external service. Credentials use value OR existingSecret, never both.
  # StatefulSet PVCs survive uninstall; changing a password does not rotate an initialized database.
  postgresql:
    enabled: true
    nameOverride: runtime-postgresql
    fullnameOverride: ''
    image:
      repository: postgres
      tag: 16-alpine
      pullPolicy: IfNotPresent
    auth:
      database: runtime
      username: runtime
      password:
        value: ''
        existingSecret:
          name: ''
          key: ''
    external:
      host: ''
      port: 5432
    persistence:
      enabled: true
      size: 8Gi
      storageClass: null
      existingClaim: ''
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    pod:
      annotations: {}
      labels: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
  # External Redis accepts host/port/auth or a secret redis:// or rediss:// URL.
  # The URL takes precedence over database; do not combine it with host/password/username/useSsl.
  redis:
    enabled: true
    nameOverride: runtime-redis
    fullnameOverride: ''
    image:
      repository: redis
      tag: 7-alpine
      pullPolicy: IfNotPresent
    database: 0
    auth:
      password:
        value: ''
        existingSecret:
          name: ''
          key: ''
      username: ''
    external:
      host: ''
      port: 6379
      url:
        value: ''
        existingSecret:
          name: ''
          key: ''
      useSsl: false
    persistence:
      enabled: true
      size: 1Gi
      storageClass: null
      existingClaim: ''
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    pod:
      annotations: {}
      labels: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
  # Embedded RabbitMQ by default; external supports host/port/auth or secret AMQP(S) URL.
  # Preserve the PVC across installs. Existing Secret changes need an explicit rollout.
  rabbitmq:
    enabled: true
    nameOverride: runtime-rabbitmq
    fullnameOverride: ''
    image:
      repository: rabbitmq
      tag: 3.13-management-alpine
      pullPolicy: IfNotPresent
    auth:
      username: runtime
      vhost: /
      password:
        value: ''
        existingSecret:
          name: ''
          key: ''
    external:
      host: ''
      port: 5672
      useSsl: false
      url:
        value: ''
        existingSecret:
          name: ''
          key: ''
    persistence:
      enabled: true
      size: 4Gi
      storageClass: null
      existingClaim: ''
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    pod:
      annotations: {}
      labels: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containerSecurityContext:
        allowPrivilegeEscalation: false
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []

