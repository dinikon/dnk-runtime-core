# Umbrella values. Replace example domain, registry, tags and Secret references.
core:
  application:
    server:
      publicOrigin: https://core.example.com
    security:
      secretKey:
        existingSecret:
          name: core-credentials
          key: django-secret-key
    mfa:
      encryptionKey:
        existingSecret:
          name: core-credentials
          key: mfa-encryption-key
    email:
      host: smtp.example.com
      from: dNiko <noreply@example.com>
      username: noreply@example.com
      password:
        existingSecret:
          name: core-credentials
          key: smtp-password
  backend:
    image:
      repository: registry.example.com/dnk-core
      tag: 0.1.0
  frontend:
    image:
      repository: registry.example.com/dnk-core-web
      tag: 0.1.0
  gateway:
    image:
      repository: registry.example.com/dnk-core-frontend
      tag: 0.1.0
  ingress:
    enabled: true
    className: nginx
    tls:
      secretName: core-tls
  postgresql:
    auth:
      password:
        existingSecret:
          name: core-credentials
          key: postgres-password
    enabled: false
    external:
      host: postgres.example.internal
      port: 5432
  redis:
    auth:
      password:
        existingSecret:
          name: core-credentials
          key: redis-password
    enabled: false
    external:
      host: redis.example.internal
      port: 6379
