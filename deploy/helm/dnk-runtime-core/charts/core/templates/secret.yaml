{{- $name := printf "%s-credentials" (include "dnk.core.fullname" .) -}}
{{- $data := dict -}}
{{- range $env, $binding := (include "dnk.core.secretBindings" . | fromYaml) -}}
{{- if and (eq $binding.name $name) $binding.source.value -}}
{{- $_ := set $data $binding.key $binding.source.value -}}
{{- end -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dnk.core.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
