apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dnk.core.fullname" . }}-gateway
  labels:
    {{- include "dnk.core.labels" . | nindent 4 }}
data:
  default.conf: |
    # The trusted ingress must overwrite forwarded headers from public clients.
    map $http_x_forwarded_proto $core_forwarded_proto {
        default $scheme;
        http http;
        https https;
    }
    server {
        listen 80;
        server_name _;
        location = /_healthz {
            access_log off;
            return 200 "ok\n";
        }
        location ~ ^/(api|accounts|admin|static)(/|$) {
            proxy_pass http://{{ include "dnk.core.fullname" . }}-backend:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $core_forwarded_proto;
        }
        location / {
            proxy_pass http://{{ include "dnk.core.fullname" . }}-frontend:{{ .Values.frontend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $core_forwarded_proto;
        }
    }
