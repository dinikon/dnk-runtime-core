{{- if .Values.enabled -}}
{{- include "dnk.postgresql.validate" . -}}
{{- if .Values.auth.password.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dnk.postgresql.fullname" . }}-auth
  labels:
    {{- include "dnk.postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.auth.password.value | b64enc | quote }}
{{- end }}
{{- end }}
