# Disable this dependency in the core chart to connect to external Redis.
enabled: true
nameOverride: core-redis
fullnameOverride: ""

image:
  repository: redis
  tag: 7-alpine
  pullPolicy: IfNotPresent

# Logical database used by the core application.
database: 1
auth:
  # Choose exactly one source. Existing Secrets must be in the release namespace.
  password:
    value: ""
    existingSecret:
      name: ""
      key: ""

external:
  host: ""
  port: 6379
  # In external mode this alternative carries a complete redis:// or rediss:// URL.
  url:
    value: ""
    existingSecret:
      name: ""
      key: ""

persistence:
  enabled: true
  size: 1Gi
  # null uses the cluster default; "" explicitly requests no StorageClass.
  storageClass: null
  # Reuse an existing writable ReadWriteOnce PVC instead of creating a claim.
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

pod:
  annotations: {}
  labels: {}
  # Official redis:7-alpine uses UID 999 and GID 1000.
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  imagePullSecrets: []
