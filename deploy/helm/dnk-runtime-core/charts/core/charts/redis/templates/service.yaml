{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnk.redis.fullname" . }}
  labels:
    {{- include "dnk.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- include "dnk.redis.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnk.redis.headlessName" . }}
  labels:
    {{- include "dnk.redis.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- include "dnk.redis.selectorLabels" . | nindent 4 }}
{{- end }}
