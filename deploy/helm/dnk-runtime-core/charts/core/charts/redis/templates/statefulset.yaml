{{- if .Values.enabled }}
{{- include "dnk.redis.validate" . -}}
{{- $annotations := deepCopy .Values.pod.annotations -}}
{{- if .Values.auth.password.value -}}
{{- $_ := set $annotations "checksum/auth" (include (print $.Template.BasePath "/secret.yaml") . | sha256sum) -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dnk.redis.fullname" . }}
  labels:
    {{- include "dnk.redis.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "dnk.redis.headlessName" . }}
  selector:
    matchLabels:
      {{- include "dnk.redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- mergeOverwrite (deepCopy .Values.pod.labels) (include "dnk.redis.labels" . | fromYaml) | toYaml | nindent 8 }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.pod.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.pod.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              # Only a fixed-length hex digest enters the ACL file, so quotes,
              # whitespace and shell syntax in the Secret remain literal bytes.
              password_hash="$(printf '%s' "$REDISCLI_AUTH" | sha256sum)"
              password_hash="${password_hash%% *}"
              printf 'user default on #%s ~* &* +@all\n' "$password_hash" > /tmp/users.acl
              exec redis-server --appendonly yes --dir /data --aclfile /tmp/users.acl --protected-mode yes
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "dnk.redis.secretName" . }}
                  key: {{ include "dnk.redis.secretKey" . | quote }}
          startupProbe:
            exec:
              command: [/bin/sh, -ec, 'test "$(redis-cli -h 127.0.0.1 ping)" = PONG']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/bin/sh, -ec, 'test "$(redis-cli -h 127.0.0.1 ping)" = PONG']
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [/bin/sh, -ec, 'test "$(redis-cli -h 127.0.0.1 ping)" = PONG']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  # Kubernetes retains these PVCs when the StatefulSet or Helm release is deleted.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if ne .Values.persistence.storageClass nil }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
{{- end }}
