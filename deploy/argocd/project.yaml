# Prepared only. Applying this file to an existing ArgoCD is a separate user step.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dnk-runtime-core
  namespace: argocd
spec:
  sourceRepos:
    - oci://ghcr.io/dinikon/dnk-runtime-core/helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dnk-runtime-core-dev
    - server: https://kubernetes.default.svc
      namespace: dnk-runtime-core
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
