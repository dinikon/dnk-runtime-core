# EXAMPLE ONLY. Replace placeholders outside Git; never commit real credentials.
# ArgoCD chart credentials are separate from Kubernetes image-pull credentials.
apiVersion: v1
kind: Secret
metadata:
  name: dnk-runtime-core-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: oci
  url: oci://ghcr.io/dinikon/dnk-runtime-core/helm
  username: replace-me-github-username
  password: replace-me-read-packages-token
---
apiVersion: v1
kind: Secret
metadata:
  name: replace-me-ghcr
  namespace: dnk-runtime-core-dev # Prepare a separate Secret in the prod namespace.
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"replace-me-github-username","password":"replace-me-read-packages-token"}}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: replace-me-runtime
  namespace: dnk-runtime-core-dev # Separate values and Secret for production.
type: Opaque
stringData:
  control-plane-api-key: replace-me
  smtp-password: replace-me
  postgres-password: replace-me
  redis-password: replace-me
  rabbitmq-password: replace-me
