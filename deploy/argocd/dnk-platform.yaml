# Replace the example domains, SMTP settings and replace-me-* Secret references below.
# AppProject productions must allow this repository and destination namespace.
# For a private GHCR package, create the registry Secret in the destination namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dnk-platform
  namespace: argocd
spec:
  project: productions
  destination:
    server: https://kubernetes.default.svc
    namespace: dnk-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: git@github.com:dinikon/dnk-runtime-core.git
    path: deploy/helm/dnk-platform
    targetRevision: main
    helm:
      parameters:
        - name: global.deployment.revision
          value: $ARGOCD_APP_REVISION
          forceString: true
      values: |
        # PLACEHOLDERS: replace all example.com domains and replace-me-* names.
        global:
          imagePullSecrets:
          - name: replace-me-ghcr
        controlPlane:
          application:
            server:
              publicOrigin: https://control-plane.example.com
            security:
              secretKey:
                existingSecret:
                  name: replace-me-control-plane
                  key: django-secret-key
            mfa:
              encryptionKey:
                existingSecret:
                  name: replace-me-control-plane
                  key: mfa-encryption-key
            email:
              host: smtp.example.com
              from: DNK <noreply@example.com>
              username: noreply@example.com
              password:
                existingSecret:
                  name: replace-me-control-plane
                  key: smtp-password
          ingress:
            enabled: true
            className: nginx
            tls:
              clusterIssuer: letsencrypt-production
              secretName: ""
          postgresql:
            auth:
              password:
                existingSecret:
                  name: replace-me-control-plane
                  key: postgres-password
          redis:
            auth:
              password:
                existingSecret:
                  name: replace-me-control-plane
                  key: redis-password
        runtime:
          application:
            server:
              publicOrigin: https://runtime.example.com
            security:
              controlPlaneApiKey:
                existingSecret:
                  name: replace-me-runtime
                  key: control-plane-api-key
            email:
              fromAddress: noreply@example.com
              smtp:
                host: smtp.example.com
                username: noreply@example.com
                password:
                  existingSecret:
                    name: replace-me-runtime
                    key: smtp-password
          ingress:
            enabled: true
            className: nginx
            tls:
              clusterIssuer: letsencrypt-production
              secretName: ""
          postgresql:
            auth:
              password:
                existingSecret:
                  name: replace-me-runtime
                  key: postgres-password
          redis:
            auth:
              password:
                existingSecret:
                  name: replace-me-runtime
                  key: redis-password
          rabbitmq:
            auth:
              password:
                existingSecret:
                  name: replace-me-runtime
                  key: rabbitmq-password
