# Replace the example domains, SMTP settings and replace-me-* Secret references below.
# AppProject productions must allow this repository and destination namespace.
# For a private GHCR package, create the registry Secret in the destination namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dnk-control-plane
  namespace: argocd
spec:
  project: productions
  destination:
    server: https://kubernetes.default.svc
    namespace: dnk-control-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: git@github.com:dinikon/dnk-runtime-core.git
    path: deploy/helm/dnk-platform/charts/dnk-control-plane
    targetRevision: main
    helm:
      parameters:
        - name: global.deployment.revision
          value: $ARGOCD_APP_REVISION
          forceString: true
      values: |
        # PLACEHOLDERS: replace all example.com domains and replace-me-* names.
        global:
          imagePullSecrets:
          - name: replace-me-ghcr
        application:
          server:
            publicOrigin: https://control-plane.example.com
          security:
            secretKey:
              existingSecret:
                name: replace-me-control-plane
                key: django-secret-key
          mfa:
            encryptionKey:
              existingSecret:
                name: replace-me-control-plane
                key: mfa-encryption-key
          email:
            host: smtp.example.com
            from: DNK <noreply@example.com>
            username: noreply@example.com
            password:
              existingSecret:
                name: replace-me-control-plane
                key: smtp-password
        ingress:
          enabled: true
          className: nginx
          tls:
            clusterIssuer: letsencrypt-production
            secretName: ""
        postgresql:
          auth:
            password:
              existingSecret:
                name: replace-me-control-plane
                key: postgres-password
        redis:
          auth:
            password:
              existingSecret:
                name: replace-me-control-plane
                key: redis-password
