application:
  server:
    publicOrigin: https://runtime.example.com
  email:
    fromAddress: noreply@example.com
    smtp:
      host: smtp.example.com
      username: noreply@example.com
      password:
        existingSecret:
          name: replace-me-runtime
          key: smtp-password
ingress:
  enabled: true
  className: nginx
  tls:
    clusterIssuer: letsencrypt-production
    secretName: ''
postgresql:
  auth:
    password:
      existingSecret:
        name: replace-me-runtime
        key: postgres-password
redis:
  auth:
    password:
      existingSecret:
        name: replace-me-runtime
        key: redis-password
rabbitmq:
  auth:
    password:
      existingSecret:
        name: replace-me-runtime
        key: rabbitmq-password
global:
  imagePullSecrets:
  - name: replace-me-ghcr
