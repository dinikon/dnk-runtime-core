# Standalone dnk-runtime-core values for the root helm/ chart.
# No credentials are generated. Never commit actual credentials.
# Shared deployment revision triggers a rollout after a new Git revision; registry Secrets are namespace-local.
global:
  deployment:
    revision: ''
  imagePullSecrets: []
  migrations:
    coordinator: ''
enabled: true
nameOverride: dnk-runtime-core
fullnameOverride: ''
# Runtime settings are translated into the environment expected by the published image.
# Set HTTPS publicOrigin, the API key and a working SMTP server before installing.
application:
  server:
    # Concrete HTTPS origin; tenant routing is configured separately in ingress.hosts.
    publicOrigin: ''
    environment: PRODUCTION
  tenancy:
    schemaPrefix: dnk_
  auth:
    otpCodeLength: 6
    otpTokenTtlSeconds: 300
    sessionTtlSeconds: 432000
    sessionCookieName: dnk_session
  priceLists:
    # Persistent Fernet key. Generate once with `openssl rand -base64 32 | tr '+/' '-_'`.
    sourceEncryptionKey:
      value: ''
      existingSecret:
        name: ''
        key: ''
  email:
    provider: smtp
    fromAddress: ''
    fromName: DNK Runtime
    smtp:
      host: ''
      port: 587
      username: ''
      password:
        value: ''
        existingSecret:
          name: ''
          key: ''
      useTls: false
      useStarttls: true
      timeoutSeconds: 10
  database:
    charset: ''
    extras: ''
    pool:
      size: 30
      maxOverflow: 10
      recycleSeconds: 3600
      useLifo: false
      prePing: true
    echo: false
    startup:
      maxAttempts: 5
      retryDelaySeconds: 1
    retrievalServiceExecutors: 4
  events:
    enabled: true
    publisherConfirms: true
    prefetch: 20
    exchangeName: dnk.integration.events
    publishLimit: 100
    retryBaseSeconds: 30
    maxAttempts: 5
    publisherIdleSleepSeconds: 0.5
    publisherErrorSleepSeconds: 5
  scheduledJobs:
    processLimit: 100
    recoverLimit: 100
    lockTtlSeconds: 300
    retryBaseSeconds: 30
    maxAttempts: 5
    pollIntervalSeconds: 2
    recoverIntervalSeconds: 30
    lockHeartbeatSeconds: 60
    shutdownGraceSeconds: 60
# Runtime-owned HTTPS integration. Core tenant creation stays disabled until acceptance.
controlPlane:
  enabled: false
  publicOrigin: ''
  managementOrigin: ''
  managementHost: ''
  allowedBaseDomains: []
  instanceId: ''
  trustedProxyNetworks: []
  allowedCoreFingerprints: []
  ingressProbeAddress: ''
  # An independent RabbitMQ user/vhost, managed by the operator; never Core's broker.
  rabbitmqUrl:
    value: ''
    existingSecret:
      name: ''
      key: ''
  installQueue: dnk.runtime.installation
  accessQueue: dnk.runtime.access
  # Existing Secret with encryption.key, tls.crt, tls.key, ca.crt; retained with backups.
  credentialsSecret: ''
  # Existing Secret with ca.crt for validating Core client certificates at ingress.
  clientCaSecret: ''
  leaseSeconds: 180
  stepTimeoutSeconds: 120
  heartbeatIntervalSeconds: 10
  heartbeatTtlSeconds: 30
  observationIntervalSeconds: 30
  observationTtlSeconds: 60
  dispatchIntervalSeconds: 5
  reconcileIntervalSeconds: 30
  requestTimeoutSeconds: 10
  retryBaseSeconds: 5
  retryMaxSeconds: 300
  ingress:
    className: nginx
    tls:
      clusterIssuer: letsencrypt-production
      secretName: ''
  networkPolicy:
    ingressNamespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx
    ingressPodSelector:
      app.kubernetes.io/component: controller
# Published FastAPI image. latest is always pulled when a new pod starts.
# extraEnv permits valueFrom but cannot replace chart-managed variables.
backend:
  image:
    repository: ghcr.io/dinikon/runtime/runtime
    tag: latest
    pullPolicy: Always
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  pod:
    annotations: {}
    labels: {}
    securityContext: {}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []
  extraEnv: []
# Published static Vue frontend; chart mounts its static Nginx configuration.
frontend:
  image:
    repository: ghcr.io/dinikon/runtime/frontend-runtime
    tag: latest
    pullPolicy: Always
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  pod:
    annotations: {}
    labels: {}
    securityContext: {}
    containerSecurityContext:
      allowPrivilegeEscalation: false
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []
# Official Nginx routes /api to FastAPI and everything else to the Vue frontend.
workers:
  cron:
    enabled: true
    image:
      repository: ghcr.io/dinikon/runtime/runtime
      tag: latest
      pullPolicy: Always
    replicas: 1
    concurrency: 4
    jobTimeoutSeconds: 900
    pollIntervalSeconds: 2
    recoverIntervalSeconds: 30
    lockTtlSeconds: 300
    lockHeartbeatSeconds: 60
    shutdownGraceSeconds: 60
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    probes:
      startup:
        exec:
          command: [dnk-manage, jobs, healthcheck, --liveness]
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 24
      readiness:
        exec:
          command: [dnk-manage, jobs, healthcheck]
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      liveness:
        exec:
          command: [dnk-manage, jobs, healthcheck, --liveness]
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 3
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
  publisher:
    image:
      repository: ghcr.io/dinikon/runtime/runtime
      tag: latest
      pullPolicy: Always
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    probes: {}
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
    enabled: true
  console:
    image:
      repository: ghcr.io/dinikon/runtime/runtime
      tag: latest
      pullPolicy: Always
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    probes: {}
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
    enabled: false
    queueName: dnk.integration.console
    routingKey: '#'
  lifecycle:
    image:
      repository: ghcr.io/dinikon/runtime/runtime
      tag: latest
      pullPolicy: Always
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    probes:
      readiness:
        exec:
          command:
          - python
          - -m
          - src.modules.control_plane.worker
          - --healthcheck
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      liveness:
        exec:
          command:
          - python
          - -m
          - src.modules.control_plane.worker
          - --healthcheck
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 6
    pod:
      annotations: {}
      labels: {}
      securityContext: {}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      nodeSelector: {}
      tolerations: []
      affinity: {}
      imagePullSecrets: []
# Existing system Ingress; cert-manager requests the certificate from this ClusterIssuer.
# Routes point directly to backend/frontend Services. No application gateway is deployed.
ingress:
  enabled: true
  className: nginx
  # Empty: use the hostname from application.server.publicOrigin (legacy behavior).
  # Shared runtime: ['*.dniko.app']. Explicit hosts replace the fallback hostname.
  hosts: []
  annotations: {}
  tls:
    # Wildcard hosts require an ACME issuer with a DNS-01 solver, or an existing certificate.
    clusterIssuer: letsencrypt-production
    # Empty: use <application-fullname>-tls, created and renewed by cert-manager.
    # For a pre-created TLS Secret, set its name and set clusterIssuer: ''.
    secretName: ''
# A retained Sync Job runs before workloads; every workload waits for all coordinator Jobs.
# Disable only when migrations are managed outside this chart.
migrations:
  enabled: true
  waitTimeoutSeconds: 300
  gateTimeoutSeconds: 900
  activeDeadlineSeconds: 600
  backoffLimit: 1
  resources: {}
# enabled=false selects an external service. Credentials use value OR existingSecret, never both.
# StatefulSet PVCs survive uninstall; changing a password does not rotate an initialized database.
postgresql:
  enabled: true
  nameOverride: runtime-postgresql
  fullnameOverride: ''
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  auth:
    database: runtime
    username: runtime
    password:
      value: ''
      existingSecret:
        name: ''
        key: ''
  external:
    host: ''
    port: 5432
  persistence:
    enabled: true
    size: 8Gi
    storageClass: null
    existingClaim: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  pod:
    annotations: {}
    labels: {}
    securityContext:
      runAsNonRoot: true
      runAsUser: 70
      runAsGroup: 70
      fsGroup: 70
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []
# External Redis accepts host/port/auth or a secret redis:// or rediss:// URL.
# The URL takes precedence over database; do not combine it with host/password/username/useSsl.
redis:
  enabled: true
  nameOverride: runtime-redis
  fullnameOverride: ''
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  database: 0
  auth:
    password:
      value: ''
      existingSecret:
        name: ''
        key: ''
    username: ''
  external:
    host: ''
    port: 6379
    url:
      value: ''
      existingSecret:
        name: ''
        key: ''
    useSsl: false
  persistence:
    enabled: true
    size: 1Gi
    storageClass: null
    existingClaim: ''
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  pod:
    annotations: {}
    labels: {}
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []
# Embedded RabbitMQ by default; external supports host/port/auth or secret AMQP(S) URL.
# Preserve the PVC across installs. Existing Secret changes need an explicit rollout.
rabbitmq:
  enabled: true
  nameOverride: runtime-rabbitmq
  fullnameOverride: ''
  image:
    repository: rabbitmq
    tag: 3.13-management-alpine
    pullPolicy: IfNotPresent
  auth:
    username: runtime
    vhost: /
    password:
      value: ''
      existingSecret:
        name: ''
        key: ''
  external:
    host: ''
    port: 5672
    useSsl: false
    url:
      value: ''
      existingSecret:
        name: ''
        key: ''
  persistence:
    enabled: true
    size: 4Gi
    storageClass: null
    existingClaim: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  pod:
    annotations: {}
    labels: {}
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      fsGroup: 101
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      allowPrivilegeEscalation: false
    nodeSelector: {}
    tolerations: []
    affinity: {}
    imagePullSecrets: []
