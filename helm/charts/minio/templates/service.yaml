{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnk.minio.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    {{- include "dnk.minio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: s3
  selector:
    {{- include "dnk.minio.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnk.minio.headlessName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    {{- include "dnk.minio.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: s3
      port: 9000
      targetPort: s3
  selector:
    {{- include "dnk.minio.selectorLabels" . | nindent 4 }}
{{- end }}
