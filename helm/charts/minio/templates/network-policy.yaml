{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dnk.minio.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    {{- include "dnk.minio.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dnk.minio.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- mergeOverwrite (deepCopy .Values.networkPolicy.clientPodSelector) (dict "app.kubernetes.io/instance" .Release.Name) | toYaml | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
{{- end }}
