{{- if .Values.enabled -}}
{{- include "dnk.minio.validate" . -}}
{{- if or .Values.auth.accessKey.value .Values.auth.secretKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dnk.minio.fullname" . }}-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  labels:
    {{- include "dnk.minio.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.accessKey.value }}
  access-key: {{ .Values.auth.accessKey.value | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.secretKey.value }}
  secret-key: {{ .Values.auth.secretKey.value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
