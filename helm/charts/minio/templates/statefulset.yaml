{{- if .Values.enabled }}
{{- include "dnk.minio.validate" . -}}
{{- $annotations := deepCopy .Values.pod.annotations -}}
{{- $_ := set $annotations "checksum/auth" (toYaml .Values.auth | sha256sum) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dnk.minio.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    {{- include "dnk.minio.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "dnk.minio.headlessName" . }}
  selector:
    matchLabels:
      {{- include "dnk.minio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- mergeOverwrite (deepCopy .Values.pod.labels) (include "dnk.minio.labels" . | fromYaml) | toYaml | nindent 8 }}
      annotations:
        {{- toYaml $annotations | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.pod.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat (default list .Values.global.imagePullSecrets) .Values.pod.imagePullSecrets | uniq }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [minio]
          args: [server, /data, --address, ':9000', --console-address, '127.0.0.1:9001', --certs-dir, /tmp/certs]
          {{- with .Values.pod.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dnk.minio.secretName" (dict "root" . "credential" "accessKey") | quote }}
                  key: {{ include "dnk.minio.secretKey" (dict "root" . "credential" "accessKey") | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dnk.minio.secretName" (dict "root" . "credential" "secretKey") | quote }}
                  key: {{ include "dnk.minio.secretKey" (dict "root" . "credential" "secretKey") | quote }}
            - name: MINIO_BROWSER
              value: 'off'
          startupProbe:
            httpGet: {path: /minio/health/live, port: s3}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if ne .Values.persistence.storageClass nil }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
{{- end }}
