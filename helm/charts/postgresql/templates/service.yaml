{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnk.postgresql.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    {{- include "dnk.postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    {{- include "dnk.postgresql.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnk.postgresql.headlessName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    {{- include "dnk.postgresql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    {{- include "dnk.postgresql.selectorLabels" . | nindent 4 }}
{{- end }}
