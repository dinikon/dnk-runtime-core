apiVersion: v2
name: dnk-runtime-core
description: DNK runtime API, Vue frontend, system Ingress and integration workers
type: application
version: 0.3.17-rc.2
appVersion: 3.4.0-rc.2
annotations:
  dnk.io/application-name: dnk-runtime-core
dependencies:
- name: postgresql
  version: 0.1.0
  condition: postgresql.enabled
- name: redis
  version: 0.1.0
  condition: redis.enabled
- name: rabbitmq
  version: 0.1.0
  condition: rabbitmq.enabled
- name: minio
  version: 0.1.0
  condition: minio.enabled
