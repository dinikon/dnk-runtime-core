{{- if .Values.ingress.enabled }}
{{- $fullname := include "dnk.runtime.fullname" . }}
{{- $hosts := include "dnk.ingress.hosts" . | fromYamlArray }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "dnk.runtime.labels" . | nindent 4 }}
  annotations:
    {{- include "dnk.ingress.annotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - secretName: {{ include "dnk.ingress.tlsSecretName" . | quote }}
      hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-backend
                port:
                  number: {{ $.Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port:
                  number: {{ $.Values.frontend.service.port }}
    {{- end }}
{{- end }}
