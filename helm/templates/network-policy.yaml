{{- if .Values.controlPlane.enabled }}
{{- range $component := list "backend" "frontend" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dnk.runtime.fullname" $ }}-{{ $component }}-ingress
  labels:
    {{- include "dnk.runtime.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dnk-runtime-core
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- $.Values.controlPlane.networkPolicy.ingressNamespaceSelector | toYaml | nindent 14 }}
          podSelector:
            matchLabels:
              {{- $.Values.controlPlane.networkPolicy.ingressPodSelector | toYaml | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ ternary 8000 80 (eq $component "backend") }}
{{- end }}
{{- end }}
