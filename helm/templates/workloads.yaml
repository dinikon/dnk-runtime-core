{{- $root := . -}}
{{- $fullname := include "dnk.runtime.fullname" . -}}
{{- $workloads := dict "backend" .Values.backend "frontend" .Values.frontend "cron" .Values.workers.cron "publisher" .Values.workers.publisher "console" .Values.workers.console "lifecycle" .Values.workers.lifecycle -}}
{{- range $component := list "backend" "frontend" "cron" "publisher" "console" "lifecycle" -}}
{{- $w := index $workloads $component -}}
{{- $worker := has $component (list "cron" "publisher" "console" "lifecycle") -}}
{{- if or (not $worker) (and (ne $component "lifecycle") $w.enabled) (and (eq $component "lifecycle") $root.Values.controlPlane.enabled) -}}
{{- $python := or $worker (eq $component "backend") -}}
{{- $integration := has $component (list "backend" "lifecycle") -}}
{{- $port := ternary 8000 80 (eq $component "backend") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $component }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "dnk.runtime.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dnk-runtime-core
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dnk-runtime-core
        app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $w.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with $w.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        dnk.io/deployment-token: {{ include "dnk.lifecycle.token" $root | quote }}
        dnk.io/deployment-revision: {{ $root.Values.global.deployment.revision | quote }}
        checksum/migration-gate: {{ include "dnk.lifecycle.gateScript" $root | sha256sum }}
        {{- if $python }}
        checksum/config: {{ printf "%s\n%s\n%s\n%s" (include "dnk.runtime.config" $root) ($root.Files.Get "files/entrypoint.py") ($root.Files.Get "files/migrate.py") ($root.Files.Get "files/http_app.py") | sha256sum }}
        checksum/credentials: {{ include "dnk.runtime.secretBindings" $root | sha256sum }}
        {{- else }}
        checksum/config: {{ include (print $root.Template.BasePath "/frontend-configmap.yaml") $root | sha256sum }}
        {{- end }}
    spec:
      {{- if eq $component "cron" }}
      terminationGracePeriodSeconds: {{ add $w.shutdownGraceSeconds 20 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- if include "dnk.lifecycle.gateEnabled" $root }}
      serviceAccountName: {{ include "dnk.lifecycle.serviceAccountName" $root }}
      {{- end }}
      {{- with concat $root.Values.global.imagePullSecrets $root.Values.backend.pod.imagePullSecrets $w.pod.imagePullSecrets | uniq }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.pod.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "dnk.lifecycle.gateEnabled" $root }}
      initContainers:
        {{- include "dnk.lifecycle.gate" $root | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ printf "%s:%s" $w.image.repository $w.image.tag | quote }}
          imagePullPolicy: {{ $w.image.pullPolicy }}
          {{- if $python }}
          command: [python, /opt/dnk-runtime/entrypoint.py]
          {{- if eq $component "backend" }}
          args: [python, -m, uvicorn, --app-dir, /opt/dnk-runtime, --factory, http_app:create_app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers]
          {{- else if eq $component "publisher" }}
          args: [dnk-manage, events, publisher-worker]
          {{- else if eq $component "cron" }}
          args: [dnk-manage, jobs, worker]
          {{- else if eq $component "lifecycle" }}
          args: [python, -m, src.modules.control_plane.worker]
          {{- else }}
          args: [dnk-manage, events, console-worker, --queue-name, {{ $w.queueName | quote }}, --routing-key, {{ $w.routingKey | quote }}]
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-{{ ternary "config" "migration-config" $integration }}
          env:
            {{- include (ternary "dnk.runtime.secretEnv" "dnk.runtime.infrastructureSecretEnv" $integration) $root | nindent 12 }}
            {{- if eq $component "cron" }}
            - name: SCHEDULED_JOBS__CONCURRENCY
              value: {{ $w.concurrency | quote }}
            - name: SCHEDULED_JOBS__JOB_TIMEOUT_SECONDS
              value: {{ $w.jobTimeoutSeconds | quote }}
            - name: SCHEDULED_JOBS__PROCESS_LIMIT
              value: {{ $root.Values.application.scheduledJobs.processLimit | quote }}
            - name: SCHEDULED_JOBS__RECOVER_LIMIT
              value: {{ $root.Values.application.scheduledJobs.recoverLimit | quote }}
            - name: SCHEDULED_JOBS__RETRY_BASE_SECONDS
              value: {{ $root.Values.application.scheduledJobs.retryBaseSeconds | quote }}
            - name: SCHEDULED_JOBS__MAX_ATTEMPTS
              value: {{ $root.Values.application.scheduledJobs.maxAttempts | quote }}
            - name: SCHEDULED_JOBS__POLL_INTERVAL_SECONDS
              value: {{ $w.pollIntervalSeconds | quote }}
            - name: SCHEDULED_JOBS__RECOVER_INTERVAL_SECONDS
              value: {{ $w.recoverIntervalSeconds | quote }}
            - name: SCHEDULED_JOBS__LOCK_TTL_SECONDS
              value: {{ $w.lockTtlSeconds | quote }}
            - name: SCHEDULED_JOBS__LOCK_HEARTBEAT_SECONDS
              value: {{ $w.lockHeartbeatSeconds | quote }}
            - name: SCHEDULED_JOBS__SHUTDOWN_GRACE_SECONDS
              value: {{ $w.shutdownGraceSeconds | quote }}
            {{- end }}
            {{- with $root.Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if not $worker }}
          ports:
            - name: http
              containerPort: {{ $port }}
          {{- range $probe := list "startup" "readiness" "liveness" }}
          {{ $probe }}Probe:
            httpGet:
              path: {{ if eq $component "frontend" }}/{{ else if eq $probe "liveness" }}/health/live{{ else }}/health/ready{{ end }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "dnk.runtime.hostname" $root | quote }}
            {{- toYaml (index $w.probes $probe) | nindent 12 }}
          {{- end }}
          {{- else }}
          {{- range $name, $probe := $w.probes }}
          {{ $name }}Probe:
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          {{- with $w.pod.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $python }}
            - name: runtime-scripts
              mountPath: /opt/dnk-runtime
              readOnly: true
            {{- if and $root.Values.controlPlane.enabled $integration }}
            - name: control-plane-credentials
              mountPath: /var/run/dnk/control-plane
              readOnly: true
            {{- end }}
            {{- else }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- end }}
      volumes:
        {{- include "dnk.lifecycle.gateVolumes" $root | nindent 8 }}
        - name: tmp
          emptyDir: {}
        {{- if $python }}
        - name: runtime-scripts
          configMap:
            name: {{ $fullname }}-scripts
        {{- if and $root.Values.controlPlane.enabled $integration }}
        - name: control-plane-credentials
          secret:
            secretName: {{ $root.Values.controlPlane.credentialsSecret | quote }}
            defaultMode: 0400
        {{- end }}
        {{- else }}
        - name: nginx-config
          configMap:
            name: {{ $fullname }}-{{ $component }}
        {{- end }}
{{- if not $worker }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $component }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "dnk.runtime.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ $w.service.type }}
  ports:
    - name: http
      port: {{ $w.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: dnk-runtime-core
    app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
    app.kubernetes.io/component: {{ $component }}
{{- end -}}{{- end -}}{{- end }}
