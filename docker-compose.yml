x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile
  image: dnk-runtime-core:local
  env_file:
    - .env
  environment: &backend-environment
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-postgres}
    DB_DATABASE: ${DB_DATABASE:-dniko}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    RABBITMQ__ENABLED: "true"
    RABBITMQ__URL: amqp://${RABBITMQ_USERNAME:-rabbitmq}:${RABBITMQ_PASSWORD:-rabbitmq}@rabbitmq:5672/
    RABBITMQ__PREFETCH: ${RABBITMQ__PREFETCH:-20}
    EVENT_BUS__PUBLISHER_WORKER_ENABLED: "true"

services:
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: dnk-core:local
    restart: unless-stopped
    env_file:
      - path: ./core/.env
        # Allow config inspection before Core's environment is prepared.
        required: false
    environment:
      CORE_DEBUG: "true"
      CORE_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      CORE_DB_HOST: postgres
      CORE_DB_PORT: "5432"
      CORE_DB_NAME: ${DB_DATABASE:-dniko}
      CORE_DB_USER: ${DB_USERNAME:-postgres}
      CORE_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORE_PUBLIC_ORIGIN: http://localhost:${CORE_FRONTEND_PORT:-8080}
      CORE_TRUSTED_PROXY_COUNT: "1"
      CORE_REDIS_HOST: redis
      CORE_REDIS_PORT: "6379"
      CORE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORE_REDIS_DB: "1"
    command:
      - sh
      - -c
      - >-
        python src/prepare_database.py &&
        python src/manage.py migrate --noinput &&
        exec gunicorn --chdir src dnk_core.wsgi:application --bind 0.0.0.0:8001
        --workers 2 --access-logfile - --error-logfile -
    ports:
      - "127.0.0.1:${CORE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/api/session/', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  core-web:
    build:
      context: ./frontends
      dockerfile: apps/core/Dockerfile
      target: runtime
    image: dnk-core-web:local
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_PUBLIC_SITE_URL: http://localhost:${CORE_FRONTEND_PORT:-8080}
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  core-frontend:
    build:
      context: ./frontends
      dockerfile: apps/core/Dockerfile
      target: gateway
    image: dnk-core-frontend:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORE_FRONTEND_PORT:-8080}:80"
    depends_on:
      core:
        condition: service_healthy
      core-web:
        condition: service_healthy

  api:
    <<: *backend-common
    container_name: dnk-api
    restart: unless-stopped
    command:
      - uvicorn
      - src.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/docs', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontends
      dockerfile: Dockerfile
    container_name: dnk-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

  events-publisher:
    <<: *backend-common
    container_name: dnk-events-publisher
    restart: unless-stopped
    command:
      - dnk-manage
      - events
      - publisher-worker
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  events-console-worker:
    <<: *backend-common
    container_name: dnk-events-console-worker
    restart: unless-stopped
    command:
      - dnk-manage
      - events
      - console-worker
      - --queue-name
      - ${EVENTS_CONSOLE_QUEUE_NAME:-dnk.integration.events.console}
      - --routing-key
      - ${EVENTS_CONSOLE_ROUTING_KEY:-#}
    depends_on:
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: dnk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dniko}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dnk-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          redis-server --appendonly yes;
        fi
      '
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dnk-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: dnk-minio
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
