x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile
  image: dnk-runtime-core:local
  env_file:
    - .env
  networks: [default, file-storage]
  environment: &backend-environment
    ENCRYPTION__KEY: ${ENCRYPTION__KEY:-}
    ENCRYPTION__KEY_PATH: ${ENCRYPTION__KEY_PATH:-}
    FILES__ENDPOINT: minio:9000
    FILES__ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    FILES__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    FILES__SECURE: "false"
    FILES__CONSOLE_MAX_UPLOAD_BYTES: ${FILES__CONSOLE_MAX_UPLOAD_BYTES:-1073741824}
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-postgres}
    DB_DATABASE: ${DB_DATABASE:-dniko}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    RABBITMQ__ENABLED: "true"
    RABBITMQ__URL: amqp://${RABBITMQ_USERNAME:-rabbitmq}:${RABBITMQ_PASSWORD:-rabbitmq}@rabbitmq:5672/
    RABBITMQ__PREFETCH: ${RABBITMQ__PREFETCH:-20}
    EVENT_BUS__PUBLISHER_WORKER_ENABLED: "true"
    AUTH__ALLOW_INSECURE_HTTP: "true"
    SCHEDULED_JOBS__JOB_TIMEOUT_SECONDS: ${SCHEDULED_JOBS__JOB_TIMEOUT_SECONDS:-3600}

services:
  migrations:
    <<: *backend-common
    command: [dnk-manage, database, upgrade]
    environment:
      <<: *backend-environment
      CONTROL_PLANE__ENABLED: "false"
      ENCRYPTION__KEY_PATH: ""
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-common
    container_name: dnk-api
    restart: unless-stopped
    command:
      - uvicorn
      - src.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

#  frontend:
#    build:
#      context: ./frontends
#      dockerfile: Dockerfile
#    container_name: dnk-frontend
#    restart: unless-stopped
#    ports:
#      - "${FRONTEND_PORT:-80}:80"
#    depends_on:
#      api:
#        condition: service_healthy

  events-publisher:
    <<: *backend-common
    container_name: dnk-events-publisher
    restart: unless-stopped
    command:
      - dnk-manage
      - events
      - publisher-worker
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  events-console-worker:
    <<: *backend-common
    container_name: dnk-events-console-worker
    restart: unless-stopped
    command:
      - dnk-manage
      - events
      - console-worker
      - --queue-name
      - ${EVENTS_CONSOLE_QUEUE_NAME:-dnk.integration.events.console}
      - --routing-key
      - ${EVENTS_CONSOLE_ROUTING_KEY:-#}
    depends_on:
      rabbitmq:
        condition: service_healthy

  cron-worker:
    <<: *backend-common
    container_name: dnk-cron-worker
    restart: unless-stopped
    command: [dnk-manage, jobs, worker]
    environment:
      <<: *backend-environment
      RABBITMQ__ENABLED: "false"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dnk-manage", "jobs", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: dnk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dniko}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dnk-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          redis-server --appendonly yes;
        fi
      '
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dnk-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/thanos/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dnk-minio
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Docker does not publish host ports for a container on internal networks only.
    # The local bridge enables loopback access for scripts run outside Docker.
    networks: [file-storage, file-storage-local]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  file-storage:
    internal: true
  file-storage-local:
    driver: bridge
